# Static host for website/out. The Docker image (website/Dockerfile) uses this file as is.
# Terminate HTTPS and enable HSTS at the edge.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a proxy that terminates TLS this nginx only ever sees http. Keep redirects (a
    # missing trailing slash) relative, or they would send visitors back to http://.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    # If NEXT_PUBLIC_DEMO_ENDPOINT or NEXT_PUBLIC_FEEDBACK_ENDPOINT is set at build
    # time, that endpoint's origin belongs in connect-src. website/Dockerfile appends it
    # for you; on any other host add it by hand, e.g.
    #   connect-src 'self' https://forms.example.com;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Caching: /_next/static/ files are content-hashed and can be cached for a year.
    # Set that at your CDN, or here with a location block that also repeats the
    # add_header lines above (nginx drops inherited add_header in a location that sets its own).

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
