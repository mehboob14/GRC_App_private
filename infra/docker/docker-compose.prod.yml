# Production stack. Run from the repository root:
#
#   docker compose --env-file infra/docker/.env.production \
#                  -f infra/docker/docker-compose.prod.yml up -d --build
#
# This is a SEPARATE file from docker-compose.yml, not an override of it. The dev
# file publishes every port to the host for native processes to reach; this one
# publishes nothing at all. On a shared server that is the whole point: the stack
# cannot collide with, or be reached through, anything else on the box.
#
# The edge proxy reaches `verity-web` by joining this project's network:
#
#   docker network connect verity_default <their-nginx-container>
#
# ...and then proxy_pass http://verity-web;  — one block, added once.

name: verity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # `:?` fails the command with a named error rather than silently starting a
      # database whose password is the string "verity_owner".
      POSTGRES_USER: ${DATABASE_OWNER_USER:-verity_owner}
      POSTGRES_PASSWORD: ${DATABASE_OWNER_PASSWORD:?set DATABASE_OWNER_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-verity}
      VERITY_APP_USER: ${DATABASE_APP_USER:-verity_app}
      VERITY_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?set DATABASE_APP_PASSWORD}
      VERITY_READONLY_USER: ${DATABASE_READONLY_USER:-verity_readonly}
      VERITY_READONLY_PASSWORD: ${DATABASE_READONLY_PASSWORD:?set DATABASE_READONLY_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates verity_app (NOSUPERUSER NOBYPASSRLS) before anything connects. This
      # has to happen before `alembic upgrade head`, because the migrations GRANT to
      # that role — and the app must never connect as the owner, which is exempt from
      # RLS on any table whose migration forgot FORCE.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DATABASE_OWNER_USER:-verity_owner} -d ${DATABASE_NAME:-verity}
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    # Pinned, unlike the dev file: MinIO has shipped breaking changes on :latest, and
    # this one holds the evidence objects.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-verity-evidence}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set verity http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "verity/$$S3_BUCKET"
        mc anonymous set none "verity/$$S3_BUCKET"
        mc version enable "verity/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready"
    restart: "no"

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: verity-api:${VERITY_VERSION:-latest}
    container_name: verity-api
    env_file:
      - .env.production
    volumes:
      # Evidence files. STORAGE_DRIVER=local writes to the container filesystem,
      # which a rebuild would discard — this volume is what makes that durable.
      # Not needed once the s3 driver exists (core/storage.py:S3ObjectStore is
      # currently a stub that raises on every call).
      - evidence-data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: verity-web:${VERITY_VERSION:-latest}
    # Fixed name so the edge proxy's `proxy_pass http://verity-web;` keeps resolving
    # across rebuilds. A generated name (verity-web-1) changes and would break it.
    container_name: verity-web
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # Runs the scheduled jobs (SLA sweep, notification-email outbox). The worker
  # executes tasks; `beat` below is the scheduler that enqueues them. Both are on
  # by default now that real jobs exist — before, an idle heartbeat did not earn a
  # container, so this was gated behind `--profile worker`.
  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: verity-api:${VERITY_VERSION:-latest}
    container_name: verity-worker
    command: ["celery", "-A", "verity.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env.production
    volumes:
      # The worker files evidence too (the scheduled connector runs), and the API has to
      # read what it wrote. Without the same volume the file lands in this container's
      # own filesystem: the evidence row exists, its download fails, and a rebuild loses it.
      - evidence-data:/app/.data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The scheduler. Exactly one beat process must run — a second would enqueue every
  # scheduled job twice. The schedule lives in code (celery_app.beat_schedule), so
  # the container needs no persistent volume.
  beat:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: verity-api:${VERITY_VERSION:-latest}
    container_name: verity-beat
    command: ["celery", "-A", "verity.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  evidence-data:
