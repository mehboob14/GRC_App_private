# Serves the built SPA and proxies the API. This replaces the Vite dev proxy
# (vite.config.ts), which is the only thing routing /api in development and does not
# exist in a static build.

upstream verity_api {
    # Compose service name on the shared project network.
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evidence upload is the largest request the app makes. Keep this in step with
    # the edge proxy in front: the smaller of the two wins, and the failure is a
    # confusing 413 rather than a validation message.
    client_max_body_size 25m;

    # Vite emits content-hashed filenames, so assets are immutable by construction.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The one file that must never be cached: it names the current asset hashes, so a
    # stale copy pins the browser to a deleted bundle and the app white-screens.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Same-origin API calls (src/lib/api/client.ts fetches `/api/v1${path}`), which is
    # why there is no CORS configuration anywhere in this deployment. Authorization is
    # a Bearer header from sessionStorage, not a cookie — nginx forwards it by default
    # and must not be made to strip it.
    location /api/ {
        proxy_pass http://verity_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # BrowserRouter with no basename, so every deep path is a real navigation that
    # nginx has to resolve. The emailed links especially — /verify-email,
    # /accept-invite, /reset-password — arrive as cold hits and 404 without this.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
