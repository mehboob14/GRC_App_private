<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/app-mark.png" />
    <title>Verity</title>
    <script>
      // Apply the stored theme before first paint, so someone who chose dark
      // does not get a flash of light. Must match lib/theme.tsx (key:
      // verity.theme).
      //
      // Light is the product default and the operating system is deliberately
      // not consulted. Dark applies only when a person has explicitly asked
      // for it; anything else, including no stored value at all, is light.
      (function () {
        try {
          var dark = window.localStorage.getItem("verity.theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage unavailable: light, same as every other fallback */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
