    "verity.modules.tenancy.service -> verity.modules.tenancy.repository",
    "verity.modules.tenancy.service -> verity.modules.tenancy.models",
    # Coverage answers "controls with no evidence", which only the evidence
    # module can know. It is asked through
    # EvidenceService.control_ids_with_evidence, never by reading
    # evidence_controls from here.
    "verity.modules.evidence.service -> verity.modules.evidence.models",
    # EvidenceService in turn resolves its linked records through those
    # modules' services; that onward call is evidence's private business, not
    # compliance reaching tasks, documents, assets or vulnerabilities.
    "verity.modules.evidence.service -> verity.modules.tasks.service",
    "verity.modules.evidence.service -> verity.modules.documents.service",
    "verity.modules.evidence.service -> verity.modules.assets.service",
    "verity.modules.evidence.service -> verity.modules.vulnerabilities.service",
