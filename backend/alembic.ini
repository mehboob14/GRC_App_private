[alembic]
script_location = src/verity/db/migrations
prepend_sys_path = src
path_separator = os

# The URL comes from DATABASE_MIGRATION_URL via verity.core.config, so that the
# migration role is used here and the application role everywhere else. Leaving this
# blank is deliberate: a URL in a committed ini file is the fastest way to run a
# migration against the wrong database.
sqlalchemy.url =

# UUIDv7-friendly, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
